{% extends 'base.html' %}
{% block content %}
<h2>Oppimispolku</h2>

{% for sec in sections %}
    <div class="card" style="border-left: 6px solid var(--duo-blue);">
        <h3>{{ sec.title }}</h3>
        {% for unit in sec.units %}
            <div style="background: var(--bg-color); border: 2px solid var(--border-color); padding: 15px; border-radius: 12px; margin: 10px 0;">
                <h4 style="margin: 0 0 5px 0;">{{ unit.title }}</h4>
                <p style="margin: 0 0 15px 0; opacity: 0.8;">{{ unit.description }}</p>
                
                {% for lesson in unit.lessons %}
                    <button class="path-lesson-btn" onclick="startLesson({{ lesson.id }})">
                        ⭐
                    </button>
                    <p style="text-align: center; font-weight: bold; margin-top: 5px;">{{ lesson.title }}</p>
                {% endfor %}
            </div>
        {% endfor %}
    </div>
{% endfor %}
{% endblock %}
