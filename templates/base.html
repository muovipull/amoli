<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo-klooni</title>
    
    <!-- ESTETÄÄN VALKOINEN VÄLÄHDYS SUORITTAMALLA TÄMÄ ENNEN SIVUN PIIRTOA -->
    <script>
        (function() {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark-theme");
            }
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    {% if session.user_id %}
    <div class="top-bar">
        <div class="stat-item">🔥 {{ user.streak if user else 1 }}</div>
        <div class="stat-item">⚡ {{ user.xp if user else 0 }} XP</div>
        <div class="stat-item">💎 {{ user.gems if user else 100 }}</div>
        <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
    </div>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- OPPITUNTIMODAALI -->
    <div id="lesson-modal" class="modal hidden">
        <button class="btn" style="background:#888; align-self:flex-end;" onclick="document.getElementById('lesson-modal').classList.add('hidden')">X</button>
        <div id="question-area" style="flex:1; margin-top:30px;"></div>
        <div id="feedback-area"></div>
    </div>

    {% if session.user_id %}
    <div class="bottom-nav">
        <a href="{{ url_for('index') }}" class="nav-item">🏠<br>Polku</a>
        <a href="{{ url_for('practice') }}" class="nav-item">🔄<br>Kertaus</a>
        <a href="{{ url_for('friends') }}" class="nav-item">👥<br>Kaverit</a>
        <a href="{{ url_for('profile', user_id=session.user_id) }}" class="nav-item">👤<br>Profiili</a>
    </div>
    {% endif %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
