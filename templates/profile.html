{% extends 'base.html' %}
{% block content %}
<div class="card" style="text-align: center;">
    <h2>👤 {{ target_user.username }}</h2>
    <p>🔥 Streak: {{ target_user.streak }} päivää | ⚡ {{ target_user.xp }} total XP</p>
</div>

<div class="card">
    <h3>📊 XP-vertailukaavio</h3>
    <canvas id="xpChart"></canvas>
</div>

<script>
const ctx = document.getElementById('xpChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Ma', 'Ti', 'Ke', 'To', 'Pe', 'La', 'Su'],
        datasets: [
            {
                label: '{{ current_user.username }} (Sinä)',
                data: [{{ current_user.history_data }}],
                backgroundColor: '#58cc02'
            },
            {
                label: '{{ target_user.username }}',
                data: [{{ target_user.history_data }}],
                backgroundColor: '#1cb0f6'
            }
        ]
    },
    options: {
        responsive: true,
        scales: { y: { beginAtZero: true } }
    }
});
</script>
{% endblock %}
